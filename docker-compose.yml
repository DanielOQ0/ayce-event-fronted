services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ayce-event-fronted:latest
    env_file:
      - .env.production
    ports:
      - '3001:3000'
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
