name: Deploy to VPS
on:
  push:
    branches:
      - main
    workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remote deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git fetch --all
            git reset --hard origin/${{ secrets.BRANCH || 'main' }}

            # Create .env.production on the server from secrets.
            if [ -n "${{ secrets.ENV_PRODUCTION }}" ]; then
              printf '%s' "${{ secrets.ENV_PRODUCTION }}" > .env.production
            else
              cat > .env.production <<EOF
            # .env.production generated by GitHub Actions
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            EOF
            fi

            docker compose pull || true
            docker compose up -d --build --remove-orphans
